<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Flow Engine</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #14171c;
        --muted: #5b6472;
        --line: #d5dae1;
        --accent: #1f5fbf;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151a;
          --fg: #eceff4;
          --muted: #9aa4b2;
          --line: #2a303a;
          --accent: #6aa3ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 system-ui,
          "Segoe UI",
          Arial,
          sans-serif;
      }
      main {
        width: min(36rem, 100% - 2rem);
        padding: 2rem 0;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 2rem;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0.5rem 0;
      }
      .muted {
        color: var(--muted);
      }
      .card {
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }
      .dot {
        display: inline-block;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: var(--accent);
        margin-inline-end: 0.5rem;
      }
      bdi {
        unicode-bidi: isolate;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Flow Engine</h1>
      <p class="muted">עורך תרשימים חד־קוויים וחישובים חשמליים</p>
      <div class="card" role="status">
        <p><span class="dot" aria-hidden="true"></span>בבנייה: זהו מעטפת בדיקה לפריסה, לפני שלב 0.</p>
        <p class="muted"><bdi>Under construction: deployment check shell, before Phase 0.</bdi></p>
      </div>
    </main>
  </body>
</html>
